on:
  push:
    branches: [main]
  workflow_dispatch:

name: shinylive

# Publishes the browser-only demo to GitHub Pages. Requires Pages to be enabled
# for the repository with "GitHub Actions" as the source.

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::shinylive

      - name: Export the app
        run: Rscript dev/make_shinylive.R _shinylive

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _shinylive

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
