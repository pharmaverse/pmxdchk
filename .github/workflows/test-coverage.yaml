on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

name: test-coverage

permissions: read-all

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr
          needs: coverage

      # Reports coverage in the job log and summary; nothing is uploaded, so no
      # token is needed.
      - name: Test coverage
        run: |
          cov <- covr::package_coverage(quiet = FALSE)
          print(cov)
          pct <- covr::percent_coverage(cov)
          cat(
            sprintf("### Test coverage: %.1f%%\n", pct),
            file = Sys.getenv("GITHUB_STEP_SUMMARY"), append = TRUE
          )
        shell: Rscript {0}
